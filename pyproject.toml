[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westquant"
version = "0.2.0"
description = "WestQuant Open Source: WQT20M quantum representation scheduling model + plugins"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "WestQuant"}]
dependencies = [
    "torch>=2.0",
    "transformers>=4.44",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
tket = ["pytket>=1.30"]
pyzx = ["pyzx>=0.9"]
