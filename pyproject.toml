[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "westquant-plugins"
version = "0.4.0"
description = "Official plugins for WQT50M and WQT20M quantum representation scheduling models — Qiskit, TKET, PyZX adapters"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "WestQuant"}]
keywords = ["quantum", "scheduling", "optimization", "wqt50", "wqt50m", "wqt20", "wqt20m", "qiskit", "tket", "pyzx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.44",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
tket = ["pytket>=1.30", "pytket-qiskit"]
pyzx = ["pyzx>=0.9"]
all = ["qiskit>=1.0", "pytket>=1.30", "pytket-qiskit", "pyzx>=0.9"]

[project.urls]
Homepage = "https://github.com/WestQuantOpen/westquant-plugins"
Documentation = "https://github.com/WestQuantOpen/westquant-plugins#readme"
"Bug Tracker" = "https://github.com/WestQuantOpen/westquant-plugins/issues"
"WQT50M Model" = "https://huggingface.co/WestQuantStudio/WQT50M"
"WQT20M-Beta Model" = "https://huggingface.co/WestQuantStudio/WQT20M-Beta"

[tool.setuptools]
packages = ["plugins", "plugins.qiskit", "plugins.tket", "plugins.pyzx", "plugins.westquant_sdk"]
