# WQT20 pilot training config (Part XIX step 14)
# Trained on oracle + search trajectories after smoke gate passes
n_trajectories: 50000
epochs: 6
batch_size: 64
lr: 5.0e-5
max_length: 1024
seed: 42
eval_split: 0.05
out_dir: checkpoints/wqt20-pilot
# structural splits evaluated after training
eval_splits:
  - unseen_size
  - unseen_graph_family
  - unseen_problem
  - unseen_backend
